name: Feature request
description: 说明一个现有问题和可验证的改进建议。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前行为和使用场景，不包含内部流程或真实业务数据。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议改动
      description: 说明范围，也可列出不增加功能的替代办法。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 如何验证
      description: 给出合成案例和预期结果，并说明如何保持人工先审、AI 后置、不自动放行。
    validations:
      required: true
