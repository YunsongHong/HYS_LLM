name: ParamGuard verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paramguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out the exact submitted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: python -m pip install --disable-pip-version-check --no-input .

      - name: Verify both installed Web templates are packaged
        run: >-
          python -c "from importlib.resources import files;
          root = files('paramguard').joinpath('static');
          assert all(root.joinpath(name).is_file() for name in
          ('paramguard.html', 'assisted.html')), 'installed Web template is missing'"

      - name: Compile source and tests
        run: python -m compileall -q src tests tools

      - name: Check the workbench's asynchronous UI behavior
        run: node tools/check_assisted_ui.mjs

      - name: Run all unit, adversarial, and integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
